TABS.forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.setAttribute("role","tab");b.onclick=function(){show(t[0])};b.dataset.t=t[0];tb.appendChild(b)});

 try{location.hash=id}catch(e){}window.scrollTo(0,0)}

$("plan").innerHTML=DAYS.map(function(d,i){var td=new Date().toDateString()===new Date(DD[i]+'T12:00:00').toDateString();return '<h2>'+d[0]+(td?' (امروز)':'')+'</h2><div class="day">'+d[1].map(function(e){return '<div class="ev"><b>'+e[0]+'</b><span>'+esc(e[1])+(e[2]?'<small>'+esc(e[2])+'</small>':'')+'</span></div>'}).join("")+'</div>'}).join("")+
'<div class="box"><b>هوا:</b> شب‌ها احتمالاً سرد است. روز در آفتاب کمی کلافه‌کننده، ولی کلاً خنک.</div>';

  h+='<div class="room'+(hit?' hit':'')+'"><strong>'+esc(r[1])+'</strong><span>'+esc(r[3])+'<br><span class="mu">'+esc(r[0])+'</span></span><em>'+r[2]+'</em></div>'});
 $("rl").innerHTML=h;

 $("pack").innerHTML='<h2>چه چیزهایی ببرم؟ ('+n+' از '+PACK.length+')</h2>'+PACK.map(function(p,i){return '<label class="ck"><input type="checkbox" data-i="'+i+'"'+(st[i]?' checked':'')+'><span>'+p+'</span></label>'}).join("");
 $("pack").querySelectorAll("input").forEach(function(c){c.onchange=function(){st[c.dataset.i]=c.checked;try{localStorage.setItem("esfahak-pack",JSON.stringify(st))}catch(e){}renderPack()}})}
renderPack();

$("rules").innerHTML='<h2>نکات مهم</h2>'+RULES.map(function(r){return '<div class="box'+(r[2]?' warn':'')+'"><b>'+r[0]+':</b> '+esc(r[1])+'</div>'}).join("");

$("road").innerHTML='<h2>بنزین</h2><div class="box warn"><b>سهمیه بنزین:</b> تا انارک با کارت آزاد می‌شود بنزین زد. از انارک به سمت طبس احتمالاً فقط با کارت سوخت خودتان. کارت را همراه داشته باشید و وقتی باک به نصف رسید، پمپ بعدی را از دست ندهید.</div><div class="box mu">تهران ← قم ← نائین ← انارک (آخرین بنزین با کارت آزاد) ← خوربیابانک ← طبس ← اصفهک</div>'+stnHtml()+fuelHtml()+'<h2>راه طولانی</h2><div class="box">مسیر حدود ۱۲ ساعت است. هر ۲ تا ۳ ساعت توقف کوتاه کنید و راننده خسته را عوض کنید. آب و تنقلات کافی ببرید. ممکن است آنتن ضعیف باشد؛ اگر ماشینی از دید دور شد، منتظرش بمانید.</div>';
bindFuel();

<script>
// Shared profiles use the server; the personal packing list stays on this device.
let state=null, editing=null, dirty=false, sharedOK=false;
const roleName={admin:'لیدر و مدیر سفر',assistant:'دستیار لیدر',member:'همسفر'};
const num=n=>fa(n), safe=v=>esc(String(v??'')).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const categories=[['سواری کوچک',7.5,41],['سواری متوسط',8.5,50],['سدان بزرگ',9.5,55],['کراس‌اوور',10,55],['شاسی‌بلند',13,80],['ون / مینی‌بوس',15,70]];
const extraTabs=[['members','همسفرها'],['profile','ویرایش اطلاعات'],['admin','مدیریت']];
for(const [id,title] of extraTabs){
 const section=document.createElement('section');section.id=id;$('rules').after(section);
 const b=document.createElement('button');b.textContent=title;b.setAttribute('role','tab');b.dataset.t=id;b.onclick=()=>show(id);tb.appendChild(b);
 TABS.push([id,title]);
}
const originalShow=show;
show=function(id){
 if(dirty && !confirm('تغییرات هنوز ذخیره نشده. از این بخش خارج می‌شوید؟'))return;
 dirty=false;editing=null;originalShow(id);
 document.querySelectorAll('.bottomnav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.page===id)));
 if(id==='profile')renderProfile();if(id==='admin')renderAdmin();
};
document.querySelector('header').innerHTML='<div class="brandline"><h1>همسفر اصفهک</h1><span class="badge">۲۷ همسفر · ۴ روز</span></div><p>۲۶ تا ۲۹ آبان ۱۴۰۵ · تهران تا دل کویر</p>';
const status=document.createElement('div');status.className='statusbar';status.innerHTML='<p id="connection" role="status">در حال اتصال…</p><button id="logout" hidden>خروج از حساب</button>';document.querySelector('header').after(status);
const bottom=document.createElement('div');bottom.className='bottomnav';bottom.setAttribute('aria-label','دسترسی سریع');bottom.innerHTML=[['plan','برنامه سفر'],['members','همسفرها'],['road','بنزین و مسیر'],['profile','ویرایش اطلاعات']].map(([id,title])=>`<button data-page="${id}">${title}</button>`).join('');document.body.appendChild(bottom);bottom.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.page));
const toast=document.createElement('div');toast.id='toast';toast.hidden=true;toast.setAttribute('role','status');document.body.appendChild(toast);let toastTimer;
function say(text){toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,5000)}
async function api(path,data){
 let response;try{response=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json','X-HamSafar':'1'}:{},body:data?JSON.stringify(data):undefined,cache:'no-store'})}catch(e){throw Error('ارتباط با سرور برقرار نیست. تغییرات ذخیره نشده‌اند؛ دوباره تلاش کنید.')}
 let result;try{result=await response.json()}catch(e){throw Error('ذخیره اطلاعات در دسترس نیست؛ کمی بعد دوباره تلاش کنید.')}
 if(!response.ok){let e=Error(result.error||'خطایی رخ داد.');e.status=response.status;throw e}return result;
}
function guest(){return `<div class="box"><h2>ورود مدیر سفر</h2><form class="fields login-form"><label>رمز مدیر<input name="code" type="password" autocomplete="current-password" required dir="ltr" maxlength="100"></label><button class="btn wide" type="submit">ورود به مدیریت</button><p class="error" role="alert"></p></form></div>`}
function bindLogin(){
 document.querySelectorAll('.login-form').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button');btn.disabled=true;try{await api('login',{code:form.elements.code.value});dirty=false;editing=null;await load();show('admin')}catch(err){form.querySelector('.error').textContent=err.message}finally{btn.disabled=false}});
}
async function load(silent=false){
 try{
  const next=await api('state');state=next;sharedOK=true;
  $('connection').textContent='اطلاعات مشترک · ویرایش بدون ورود';
  $('logout').hidden=state.me?.role!=='admin';
  renderMembers();renderAnnouncements();renderAssignedRooms();
  if(!dirty&&editing===null){if($('profile').classList.contains('on'))renderProfile();if($('admin').classList.contains('on'))renderAdmin()}
 }catch(err){
  sharedOK=false;
  $('connection').textContent='اتصال قطع است · فهرست نام‌ها در دسترس است؛ ذخیره به اتصال نیاز دارد';if(!silent)say(err.message);

 }
}
function renderMembers(){
 const active=state.members.filter(m=>m.active),complete=active.filter(m=>m.profile.display_name),ready=active.filter(m=>m.profile.ready);
 const oldQuery=$('memberSearch')?.value||'';
 $('members').innerHTML=`<h2>آدم‌های این سفر</h2><p class="intro">همهٔ نام‌ها اینجا هستند. برای تکمیل اطلاعات، دکمهٔ ویرایش کنار نام خودتان را بزنید.</p><div class="stats"><div><b>${num(active.length)}</b>همسفر</div><div><b>${num(complete.length)}</b>پروفایل تکمیل‌شده</div><div><b>${num(ready.length)}</b>آماده حرکت</div></div><div class="actions"><button class="btn" id="editMine">ویرایش اطلاعات همسفرها</button><button class="btn subtle" id="refreshMembers">تازه‌سازی</button></div><label for="memberSearch" class="helper">جست‌وجوی نام یا شهر</label><input id="memberSearch" type="search" placeholder="نام فارسی، تلگرام یا شهر…"><div id="membersList"></div>`;
 $('memberSearch').value=oldQuery;$('memberSearch').oninput=filterMembers;$('editMine').onclick=()=>show('profile');$('refreshMembers').onclick=()=>load();filterMembers();
}
function filterMembers(){
 const query=norm($('memberSearch').value).toLowerCase();const matches=state.members.filter(m=>m.active&&norm(m.name+' '+(m.profile.display_name||'')+' '+(m.profile.city||'')).toLowerCase().includes(query));
 $('membersList').innerHTML=matches.map(m=>{let p=m.profile;return `<article class="membercard"><div class="memberhead"><span class="avatar" aria-hidden="true">${safe(m.name.split(' ').slice(0,2).map(x=>x[0]).join(''))}</span><div><div class="membername" dir="auto">${safe(p.display_name||m.name)}</div>${p.display_name?`<div class="telegram" dir="ltr">${safe(m.name)}</div>`:''}<span class="helper">${roleName[m.role]}</span></div></div><div class="membermeta"><span class="tag ${p.ready?'ready':''}">${p.ready?'آماده حرکت':'آمادگی ثبت نشده'}</span>${p.city?`<span class="tag">از ${safe(p.city)}</span>`:''}${p.car?`<span class="tag">${safe(p.car)} · ${num(p.seats||0)} صندلی آزاد</span>`:''}${m.room?`<span class="tag">${safe(m.room)}</span>`:''}</div>${p.about?`<p>${safe(p.about)}</p>`:''}${p.phone&&p.share_phone?`<a class="muted-link" dir="ltr" href="tel:${safe(p.phone)}">${safe(p.phone)}</a>`:''}${!p.display_name?'<p class="helper">هنوز پروفایلش را تکمیل نکرده است.</p>':''}<button class="btn subtle" type="button" data-edit-member="${m.id}">ویرایش اطلاعات</button></article>`}).join('')||'<p class="empty">همسفری با این نام یا شهر پیدا نشد.</p>';
 $('membersList').querySelectorAll('[data-edit-member]').forEach(b=>b.onclick=()=>openMember(Number(b.dataset.editMember)));
}
function profileForm(m,admin=false){
 const p=m.profile;return `<div class="box" id="editor"><h2>${admin?'ویرایش همسفر':'ویرایش اطلاعات'}</h2><p dir="ltr" class="telegram">${safe(m.name)}</p><p class="helper">اطلاعات این بخش برای همه قابل مشاهده و ویرایش است. لطفاً اطلاعات خودتان را کامل کنید.</p><form id="profileForm" class="fields"><label>نامی که دوست دارید نمایش داده شود<input name="display_name" required maxlength="80" value="${safe(p.display_name||'')}" placeholder="مثلاً پویا میری"></label><label>شهر مبدأ<input name="city" maxlength="60" value="${safe(p.city||'')}" placeholder="مثلاً تهران"></label><label>خودرو<select name="car"><option value="">مسافر هستم / مشخص نشده</option>${categories.map(c=>`<option ${p.car===c[0]?'selected':''}>${c[0]}</option>`).join('')}</select></label><label>صندلی آزاد برای همسفرها<input type="number" name="seats" min="0" max="20" value="${p.seats||0}" inputmode="numeric"><small>این عدد اعلام ظرفیت است؛ رزرو صندلی با هماهنگی لیدر انجام می‌شود.</small></label><label>معرفی کوتاه / هماهنگی<input name="about" maxlength="300" value="${safe(p.about||'')}" placeholder="مثلاً از تهران حرکت می‌کنم."><small>اطلاعات پزشکی یا اطلاعات حساس را اینجا ننویسید.</small></label>${state.me?.role==='admin'?`<label>شماره تماس (اختیاری)<input name="phone" type="tel" dir="ltr" maxlength="20" value="${safe(p.phone||'')}" placeholder="09…"></label><label class="check"><input type="checkbox" name="share_phone" ${p.share_phone?'checked':''}>شماره تماس من به اعضای سفر نمایش داده شود.</label>`:''}<label class="check"><input type="checkbox" name="ready" ${p.ready?'checked':''}>برای حرکت بعدی آماده‌ام.</label>${admin?`<label>اقامتگاه و اتاق<input name="room" maxlength="120" value="${safe(m.room)}" placeholder="مثلاً حاجی‌پدر · ۱۱۵"></label><label class="check"><input name="active" type="checkbox" ${m.active?'checked':''}>عضو فعال سفر است.</label>`:`<div class="helper">اتاق شما: ${safe(m.room||'هنوز توسط مدیر تعیین نشده')}</div>`}<div class="actions"><button class="btn" type="submit">ذخیره اطلاعات</button><button class="btn subtle" type="button" id="cancelEdit">انصراف</button></div><p class="error" id="profileError" role="alert"></p></form></div>`;
}
function bindProfile(m,admin){
 const form=$('profileForm');editing=m.id;form.oninput=()=>dirty=true;form.onchange=()=>dirty=true;
 $('cancelEdit').onclick=()=>{dirty=false;editing=null;admin?renderAdmin():renderProfile()};
 form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('[type=submit]');b.disabled=true;
  const p={display_name:form.elements.display_name.value,city:form.elements.city.value,car:form.elements.car.value,seats:Number(form.elements.seats.value),about:form.elements.about.value,phone:(form.elements.phone?.value||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)),share_phone:(form.elements.share_phone?.checked||false),ready:form.elements.ready.checked};
  let payload={id:m.id,version:m.version,profile:p};if(admin){payload.room=form.elements.room.value;payload.active=form.elements.active.checked}
  try{await api('profile',payload);dirty=false;editing=null;await load();say('اطلاعات ذخیره شد و برای اعضای سفر قابل مشاهده است.')}catch(err){$('profileError').textContent=err.message;if(err.status===409){$('profileError').innerHTML=safe(err.message)+' <button type="button" class="btn subtle" id="reloadConflict">دریافت نسخه تازه</button>';$('reloadConflict').onclick=()=>{dirty=false;editing=null;load()}}}finally{b.disabled=false}
 };
}
function openMember(id){show('profile');if(!$('profile').classList.contains('on'))return;const m=state.members.find(m=>m.id===id);if(!m)return;$('profile').innerHTML=profileForm(m);bindProfile(m,false)}
function renderProfile(){
 $('profile').innerHTML='<div class="box"><h2>ویرایش اطلاعات همسفرها</h2><p>روی نام خودتان بزنید و اطلاعات سفر را کامل کنید؛ نیازی به ورود نیست.</p><div class="fields">'+state.members.filter(m=>m.active).map(m=>`<button class="btn subtle" type="button" data-profile-member="${m.id}" dir="auto">${safe(m.profile.display_name||m.name)}</button>`).join('')+'</div></div>';
 $('profile').querySelectorAll('[data-profile-member]').forEach(b=>b.onclick=()=>openMember(Number(b.dataset.profileMember)));
}
function renderAdmin(){
 if(!state||state.me?.role!=='admin'){$('admin').innerHTML=guest();bindLogin();return}
 $('admin').innerHTML=`<h2>مدیریت سفر</h2><p class="intro">دسترسی مدیر روی سرور کنترل می‌شود. اطلاعات مهم بدون تأیید لیدر به اعضا نسبت داده نشده است.</p><div class="box"><h3>اطلاعیه مشترک</h3><form id="announcementForm" class="fields"><label>متن اطلاعیه<textarea id="announcementText" maxlength="1200">${safe(state.announcement)}</textarea></label><button class="btn" type="submit">ذخیره اطلاعیه برای گروه</button></form></div><div class="box"><h3>اعضا و تخصیص اتاق</h3><label for="adminMember">انتخاب همسفر</label><select id="adminMember"><option value="">یک نفر را انتخاب کنید</option>${state.members.map(m=>`<option value="${m.id}">${safe(m.name)}${m.active?'':' — غیرفعال'}</option>`).join('')}</select><div id="adminEditor"></div></div><div class="box"><h3>آخرین تغییرات</h3><p class="helper">ثبت ویرایش‌ها برای پیگیری مدیر؛ محتوای خصوصی در این فهرست تکرار نمی‌شود.</p>${state.audit.map(a=>`<div class="mem"><span>${safe(state.members.find(m=>m.id===a.actor)?.name||'ویرایش عمومی')} · ${a.action==='announcement'?'اطلاعیه':safe(state.members.find(m=>m.id===a.target)?.name||'پروفایل')}</span><small>${new Intl.DateTimeFormat('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tehran'}).format(new Date(a.stamp*1000))}</small></div>`).join('')||'<p class="helper">هنوز تغییری ثبت نشده است.</p>'}</div>`;
 $('announcementText').oninput=()=>dirty=true;
 $('announcementForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{await api('announcement',{text:$('announcementText').value});dirty=false;await load();say('اطلاعیه برای اعضای سفر ذخیره شد.')}catch(err){say(err.message)}finally{btn.disabled=false}};
 $('adminMember').onchange=()=>{if(dirty&&!confirm('تغییرات ذخیره نشده‌اند. ادامه می‌دهید؟'))return;dirty=false;let m=state.members.find(m=>m.id===Number($('adminMember').value));$('adminEditor').innerHTML=m?profileForm(m,true):'';if(m)bindProfile(m,true)};
}
function renderAnnouncements(){document.querySelectorAll('.shared-announcement').forEach(x=>x.remove());if(state.announcement){const el=document.createElement('div');el.className='box shared-announcement';el.innerHTML='<span class="notice-title">اطلاعیه لیدر</span><p class="notice-content">'+safe(state.announcement)+'</p>';$('plan').prepend(el)}}
function renderAssignedRooms(){
 document.querySelectorAll('.sharedrooms').forEach(x=>x.remove());const el=document.createElement('div');el.className='box sharedrooms';el.innerHTML='<h2>اتاق‌های تأییدشده اعضا</h2><p class="helper">اتصال نام‌های تلگرام به اتاق‌ها را مدیر تأیید می‌کند؛ اسامی مشابه خودکار تطبیق داده نشده‌اند.</p>'+state.members.filter(m=>m.active&&m.room).map(m=>`<div class="mem"><span dir="auto">${safe(m.profile.display_name||m.name)}</span><b>${safe(m.room)}</b></div>`).join('');if(!state.members.some(m=>m.active&&m.room))el.innerHTML+='<p class="helper">هنوز اتاقی به نام اعضای این فهرست ثبت نشده است.</p>';$('rooms').prepend(el);
}
$('logout').onclick=async()=>{if(dirty&&!confirm('تغییرات ذخیره نشده‌اند. خارج می‌شوید؟'))return;try{await api('logout',{});dirty=false;editing=null;await load();say('از حساب خارج شدید.')}catch(e){say(e.message)}};
// A next scheduled rendezvous is deliberately not a GPS/location feature.
const nextCard=document.createElement('div');nextCard.className='box';nextCard.id='nextMeetup';$('plan').prepend(nextCard);
function nextMeetup(){
 const now=Date.now();const events=[];
 DAYS.forEach((day,i)=>day[1].forEach(e=>{const normalized=e[0].replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));if(/^\d{1,2}:\d{2}$/.test(normalized)){const [h,m]=normalized.split(':');events.push({at:Date.parse(DD[i]+'T'+h.padStart(2,'0')+':'+m+':00+03:30'),e,day:day[0]})}}));
 const n=events.find(e=>e.at>now);nextCard.innerHTML='<span class="notice-title">قرار بعدی گروه</span>'+(n?`<div class="next-time">${safe(n.e[0])}</div><b>${safe(n.e[1])}</b><p class="helper">${safe(n.day)}${n.e[2]?' · '+safe(n.e[2]):''}</p>`:'<p>قرار بعدی با ساعت دقیق در برنامه ثبت نشده است؛ برنامه کامل و اطلاعیه لیدر را بررسی کنید.</p>')+'<p class="helper">بر اساس برنامه سفر و ساعت تهران؛ موقعیت شما را نمی‌گیرد. برنامه‌های «ظهر»، «عصر» و «شب» را در فهرست روزانه ببینید. تغییرات نهایی با لیدر است.</p>';
}nextMeetup();setInterval(nextMeetup,60000);
// Replace model-specific guesses with transparent, editable category averages.
$('road').innerHTML=`<h2>ماشین‌حساب بنزین</h2><p class="intro">تخمین دسته‌ای برای برنامه‌ریزی؛ مصرف واقعی هر خودرو متفاوت است.</p><div class="box"><form id="fuelForm" class="fields"><label>دسته خودرو<select id="carCategory">${categories.map((c,i)=>`<option value="${i}">${c[0]} · میانگین ${num(c[1])} لیتر در ۱۰۰ کیلومتر</option>`).join('')}</select></label><div class="fuelcols"><label>مسافت پیش رو (کیلومتر)<input id="distance" type="number" inputmode="decimal" min="1" max="10000" value="100" step="any" required></label><label>مصرف میانگین (لیتر / ۱۰۰ کیلومتر)<input id="consumption" type="number" inputmode="decimal" min="1" max="50" value="7.5" step="any" required></label><label>ظرفیت باک (لیتر)<input id="tank" type="number" inputmode="decimal" min="5" max="200" value="41" step="any" required></label><label>بنزین فعلی<select id="tankLevel"><option value="1">باک پر</option><option value=".75">سه‌چهارم باک</option><option value=".5">نصف باک</option><option value=".25">ربع باک</option></select></label></div><p class="helper">ظرفیت باک و مصرف، فرض نمونه برای این دسته‌اند؛ اگر عدد خودروی خودتان را می‌دانید تغییر دهید. مسافت را از مسیریاب وارد کنید؛ مقدار اولیه ۱۰۰ کیلومتر فقط مثال است.</p><div id="fuelResult" aria-live="polite"></div></form></div><h2>پیش از حرکت</h2><div class="box"><p>کارت سوخت شخصی همراه داشته باشید. وضعیت سهمیه، موجودی و ساعت کار پمپ‌ها باید همان روز بررسی شود.</p><p>مسیر اعلام‌شده سفر: تهران ← قم ← نائین ← انارک ← خوربیابانک ← طبس ← اصفهک</p><p class="helper">مسافت جاده‌ای دقیق و باز بودن پمپ‌بنزین در این برنامه تأیید نشده؛ برای تصمیم سوخت‌گیری روی تخمین قدیمی فاصله‌ها تکیه نکنید.</p></div><h2>جست‌وجوی پمپ‌بنزین روی نقشه</h2><div class="box"><div class="chips">${['قم','نائین','انارک','خور','طبس'].map(city=>`<a class="btn subtle" href="https://www.google.com/maps/search/${encodeURIComponent('پمپ بنزین '+city)}" target="_blank" rel="noopener">${city}</a>`).join('')}</div><p class="helper">باز کردن نقشه به اینترنت نیاز دارد.</p></div><div class="box"><b>استراحت راننده</b><p>در مسیر طولانی توقف منظم داشته باشید و قبل از خستگی راننده را عوض کنید. آب و خوراکی همراه داشته باشید.</p></div>`;
function fuel(){const f=$('fuelForm');if(!f.checkValidity()){$('fuelResult').innerHTML='<p class="error">مسافت، مصرف و ظرفیت باک باید عدد مثبت و در بازه مشخص‌شده باشند.</p>';return}const d=+$('distance').value,c=+$('consumption').value,t=+$('tank').value,l=+$('tankLevel').value;const current=t*l,reserve=t*.2,usable=Math.max(0,current-reserve),need=d*c/100,range=usable/c*100,extra=Math.max(0,need+reserve-current),over=need+reserve>t;const round=n=>num(Math.round(n*10)/10);$('fuelResult').innerHTML=`<div class="calc-result"><strong>${round(need)} لیتر</strong><div>مصرف تخمینی برای ${num(d)} کیلومتر</div></div><p>با حفظ ۲۰٪ ظرفیت باک به‌عنوان ذخیره، برد تخمینی فعلی <b>${num(Math.floor(range))} کیلومتر</b> است.</p><p>${over?'این مسیر با یک باک و ذخیره انتخابی پوشش داده نمی‌شود؛ توقف سوخت‌گیری در مسیر لازم است.':extra>0?'برای این تخمین، حدود '+round(extra)+' لیتر سوخت بیشتر لازم است.':'در این تخمین، سوخت فعلی مسیر را با ذخیره انتخابی پوشش می‌دهد.'}</p><p class="helper">۲۰٪ ذخیره، فرض محاسبه این ابزار است و تضمین رسیدن نیست. بار، شیب، سرعت و کولر مصرف را تغییر می‌دهند.</p>`}
$('carCategory').onchange=()=>{const c=categories[+$('carCategory').value];$('consumption').value=c[1];$('tank').value=c[2];fuel()};$('fuelForm').oninput=fuel;$('fuelForm').onsubmit=e=>e.preventDefault();fuel();

state={me:null,members:ALL.map((name,i)=>({id:i+1,name,role:i===2?'admin':[3,4,5].includes(i)?'assistant':'member',profile:{},room:'',active:true,version:0})),announcement:'',audit:[]};renderMembers();renderProfile();
show(TABS.some(t=>t[0]===requested)?requested:'members');load();
